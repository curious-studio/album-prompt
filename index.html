<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Album Prompter</title>
    <meta name="description" content="Three unexpected album and artist pairings for your next design exercise.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="app">
        <main class="workshop-stage">
        <div class="hero">
            <h1 class="eyebrow">DSU Preview Day FA26</h1>
            <p class="intro">The record label designed a very basic album cover. Can you do&nbsp;better?</p>
            <div id="promptOutput" class="prompts" aria-live="polite" aria-atomic="true"></div>
            <div class="hero-actions">
                <button id="newPrompt" class="btn primary">New albums</button>
                <label class="theme-toggle description-toggle">
                    <input id="descriptionToggle" type="checkbox" checked aria-controls="promptOutput">
                    <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-knob"></span></span>
                    <span>Show descriptions</span>
                </label>
                <label class="theme-toggle">
                    <span>Light</span>
                    <input id="themeToggle" type="checkbox" aria-label="Dark">
                    <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-knob"></span></span>
                    <span>Dark</span>
                </label>
                <span id="copyToast" class="toast" role="status"></span>
            </div>
        </div>
        </main>
        <footer class="colophon">
            <a class="folder-qr" href="https://drive.google.com/drive/folders/14ya4CU2-sau7eALwdncAlFDNBOPP4_iM?usp=sharing" target="_blank" rel="noopener noreferrer" aria-label="Open workshop Google Drive folder (opens in a new tab)">
                <img src="./images/google-drive-qr.png" alt="QR code for the workshop Google Drive folder" width="112" height="112">
            </a>
            <a class="workshop-materials" href="https://drive.google.com/drive/folders/14ya4CU2-sau7eALwdncAlFDNBOPP4_iM?usp=sharing" target="_blank" rel="noopener noreferrer">Design workshop materials<br>DSU Preview Day, October 30, 2026</a>
        </footer>
    </div>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
